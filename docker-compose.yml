services:
  postgres:
    image: postgres:16-alpine
    container_name: crittable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crittable
      POSTGRES_PASSWORD: crittable
      POSTGRES_DB: crittable
    ports:
      - "5432:5432"
    volumes:
      - crittable-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crittable -d crittable"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crittable-postgres-data:
